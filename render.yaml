services:
  - type: web
    name: careconnect
    runtime: node
    plan: free
    buildCommand: npm run postinstall && npm run build
    startCommand: node server/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRE
        value: 7d
      - key: DEFAULT_SEARCH_RADIUS_KM
        value: 15
      # Add MONGO_URI from your MongoDB Atlas cluster:
      # - key: MONGO_URI
      #   value: mongodb+srv://<username>:<password>@cluster0.mongodb.net/careconnect?retryWrites=true&w=majority
