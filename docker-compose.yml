version: '3.8'

services:
  # MongoDB Database Service
  mongo:
    image: mongo:7.0
    container_name: careconnect-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_DATABASE: careconnect
    volumes:
      - mongo_data:/data/db
    networks:
      - careconnect-network

  # CareConnect Full-Stack App (Server + Built Client + Socket.IO)
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: careconnect-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - NODE_ENV=production
      - MONGO_URI=mongodb://mongo:27017/careconnect
      - JWT_SECRET=careconnect_super_secret_jwt_key_2026_dev_secure
      - JWT_EXPIRE=7d
      - DEFAULT_SEARCH_RADIUS_KM=15
    depends_on:
      - mongo
    networks:
      - careconnect-network

volumes:
  mongo_data:
    driver: local

networks:
  careconnect-network:
    driver: bridge
